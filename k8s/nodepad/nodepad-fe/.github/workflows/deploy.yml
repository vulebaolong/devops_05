name: Deploy Nodepad FE

on:
    workflow_dispatch:

env:
    SSH_SERVER: ${{ secrets.SSH_USER }}@${{ secrets.IP_SERVER_RUN }} 
    COMPOSE_FILE_DIR: ${{ vars.NODEPAD_COMPOSE_DIR || '/home/ubuntu/devops04' }}
    IMAGE_NAME: vulebaolong/img-nodepad_fe
    IMAGE_TAG: latest
    SERVICE_NAME: nodepad_fe
    NEXT_PUBLIC_API_URL: https://nodepad-be.vulebaolong.com/api

concurrency:
    group: deploy-nodepad-fe
    cancel-in-progress: false

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: webfactory/ssh-agent
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.SSH_KEY }}

            - name: Trust host
              run: ssh-keyscan -H ${{ secrets.IP_SERVER_RUN }} >> ~/.ssh/known_hosts

            - name: Check Dockerfile
              run: test -f Dockerfile

            - name: Check env file
              run: |
                ssh $SSH_SERVER "
                    set -e
                    cd '$COMPOSE_FILE_DIR'
                    test -f .env
                "

            - name: Check docker compose file
              run: |
                ssh $SSH_SERVER "
                    set -e
                    cd '$COMPOSE_FILE_DIR'
                    test -f docker-compose.yml
                    docker compose config --services | grep -Fx '$SERVICE_NAME'
                "

    build:
        needs: [check]
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: webfactory/ssh-agent
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.SSH_KEY }}

            - name: Trust host
              run: ssh-keyscan -H ${{ secrets.IP_SERVER_RUN }} >> ~/.ssh/known_hosts

            - name: Docker build image
              run: |
                  docker build \
                  --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
                  -t "$IMAGE_NAME:$IMAGE_TAG" .

            - name: Move Image To Server
              run: |
                  set -euo pipefail
                  docker save "$IMAGE_NAME:$IMAGE_TAG" | gzip | ssh "$SSH_SERVER" "set -e; set -o pipefail; gunzip | docker load"

    deploy:
        needs: [check, build]

        runs-on: ubuntu-latest

        steps:
            - name: webfactory/ssh-agent
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.SSH_KEY }}

            - name: Trust host
              run: ssh-keyscan -H ${{ secrets.IP_SERVER_RUN }} >> ~/.ssh/known_hosts

            - name: Deploy
              run: |
                ssh $SSH_SERVER "
                    set -e

                    cd '$COMPOSE_FILE_DIR'

                    docker image inspect '$IMAGE_NAME:$IMAGE_TAG' > /dev/null
                    docker compose up -d --no-deps --pull never --force-recreate '$SERVICE_NAME'
                    docker compose ps '$SERVICE_NAME'
                "
