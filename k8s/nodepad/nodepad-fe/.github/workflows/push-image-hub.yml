name: Push Image hub

on:
    workflow_dispatch:

env:
    IMAGE_NAME: img-nodepad_fe
    IMAGE_TAG: latest
    NEXT_PUBLIC_API_URL: https://nodepad-be.vulebaolong.com/api

    NODEPAD_USERNAME_DOCKER: vulebaolong
    NODEPAD_TOKEN_DOCKER: ${{ secrets.NODEPAD_TOKEN_DOCKER }}

jobs:
    # ==================================================
    # JOB 1: BUILD VÀ PUSH IMAGE
    # ==================================================
    build-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ env.NODEPAD_USERNAME_DOCKER }}
                  password: ${{ env.NODEPAD_TOKEN_DOCKER }}

            - name: Build Docker image
              run: |
                  docker build \
                  --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
                  -t "$NODEPAD_USERNAME_DOCKER/$IMAGE_NAME:$IMAGE_TAG" .

            - name: Push Docker image
              run: |
                  docker push "$NODEPAD_USERNAME_DOCKER/$IMAGE_NAME:$IMAGE_TAG"
