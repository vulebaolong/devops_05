server {
    listen 80;
    listen [::]:80;

    server_name html.vulebaolong.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name html.vulebaolong.com;

    ssl_certificate /etc/nginx/ssl/vulebaolong.com.cer;
    ssl_certificate_key /etc/nginx/ssl/vulebaolong.com.key;

    location ~* \.jpg$ {
        proxy_pass http://0.0.0.0:3002;
        include proxy_params;

        # add_header Cache-Control "public, max-age=3600";

        proxy_cache html_cache;
        proxy_cache_valid 200 1m;
        add_header Cache-Status $upstream_cache_status always;
    }

    location / {
        proxy_pass http://0.0.0.0:3002;
        include proxy_params;
    }
}