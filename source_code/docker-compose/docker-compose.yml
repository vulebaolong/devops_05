services:
  # docker run --name database -e POSTGRES_PASSWORD=12345 -d -v database_volume:/var/lib/postgresql -p 5432:5432  postgres:18
  database:
    image: postgres:18
    container_name: database
    ports:
      - 5432:5432
    volumes:
      - database_volume:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=12345
    healthcheck:
      test: [ "CMD", "pg_isready", "--host", "localhost" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # logging:
    #   driver: "json-file"
    #   options:
    #     max-size: "100m"
    #     max-file: "100"

    # docker run --name csharp_be -d -p 8001:8080 --env-file=.env csharp_be_img
  csharp_be:
    depends_on:
      database:
        condition: service_healthy
    image: csharp_be_img
    container_name: csharp_be
    ports:
      - 8001:8080
    env_file:
      - ../csharp_be/.env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # docker run --name go_gin_be -d -p 8002:8080 --env-file=.env go_gin_be_img
  go_gin_be:
    depends_on:
      database:
        condition: service_healthy
    image: go_gin_be_img
    container_name: go_gin_be
    ports:
      - 8002:8080
    env_file:
      - ../go_gin_be/.env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  #  docker run --name java_be -d -p 8003:8080 --env-file=.env java_be_img
  java_be:
    depends_on:
      database:
        condition: service_healthy
    image: java_be_img
    container_name: java_be
    ports:
      - 8003:8080
    env_file:
      - ../java_be/.env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # docker run --name js_nestjs -d -p 8004:3000 --env-file=.env js_nestjs_img
  js_nestjs:
    depends_on:
      database:
        condition: service_healthy
    image: vulebaolong/js_nestjs_img
    container_name: js_nestjs
    ports:
      - 8004:3000
    env_file:
      - ../js_nestjs/.env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # docker run --name python_flask_be -d -p 8005:8080 --env-file=.env python_flask_be_img
  python_flask_be:
    depends_on:
      database:
        condition: service_healthy
    image: python_flask_be_img
    container_name: python_flask_be
    ports:
      - 8005:8080
    env_file:
      - ../python_flask_be/.env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # docker run --name js_react_vite -d -p 3001:80 js_react_vite_img
  js_react_vite:
    image: js_react_vite_img
    container_name: js_react_vite
    ports:
