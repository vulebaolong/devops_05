server {
    listen 80;
    listen [::]:80;

    server_name go.vulebaolong.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name go.vulebaolong.com;

    ssl_certificate /etc/nginx/ssl/vulebaolong.com.cer;
    ssl_certificate_key /etc/nginx/ssl/vulebaolong.com.key;

    location / {
        proxy_pass http://0.0.0.0:8002;
        include proxy_params;
    }
}