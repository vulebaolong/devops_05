upstream golang_backend {
    # least_conn;
    server 172.31.35.220:8080 weight=3;
    server 172.31.32.124:8080 weight=1;
    server 172.31.32.223:8080 weight=1;
}

server {
    listen 80;
    listen [::]:80;

    server_name load-balance.vulebaolong.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name load-balance.vulebaolong.com;

    ssl_certificate /etc/nginx/ssl/vulebaolong.com.cer;
    ssl_certificate_key /etc/nginx/ssl/vulebaolong.com.key;

    location / {
        proxy_pass http://golang_backend;
        include proxy_params;
    }
}